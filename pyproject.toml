[project]
name = "projectv-workers"
version = "0.1.0"
description = "Python media/ML workers for projectv (Temporal activities)"
requires-python = ">=3.11,<3.14"
dependencies = [
    "temporalio>=1.36,<2",
    "python-dotenv>=1.0",
    "modal>=1.6.4",
    "google-genai>=1.40",
    "boto3>=1.40",
    "librosa>=0.11",
    "soundfile>=0.13",
    "opentimelineio>=0.18",
    "otio-fcp-adapter>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false
