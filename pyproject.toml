[project]
name = "projectv-workers"
version = "0.1.0"
description = "Python media/ML workers for projectv (Temporal activities)"
# Kokoro (local voice) supports Python < 3.13; the worker runs on 3.11.
requires-python = ">=3.11,<3.13"
dependencies = [
    "temporalio>=1.36,<2",
    "python-dotenv>=1.0",
    "modal>=1.6.4",
    "google-genai>=1.40",
    "boto3>=1.40",
    "librosa>=0.11",
    "soundfile>=0.13",
    "opentimelineio>=0.18",
    "otio-fcp-adapter>=1.0",
    # Local GPU/CPU work on the laptop (18 Nov 2026): RIFE smooth motion on the RTX 3050 and the Kokoro voice
    # safety net. CUDA 12.8 build of PyTorch, same version as the Modal apps.
    "torch==2.8.0",
    "huggingface_hub>=0.35",
    "kokoro>=0.9.4",
    # Source check: Scrapling's core is only an HTML parser (BSD-3). Its "fetchers" extra (stealth/anti-bot,
    # browser fingerprints) is deliberately NOT installed: we read pages politely (rule 4).
    "scrapling>=0.5.1",
    # misaki (Kokoro's English phonemizer) needs spaCy's small English model; uv venvs have no pip to fetch it later.
    "en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "manim>=0.19",
]

[dependency-groups]
dev = ["pytest>=8"]
# Code checkers, installed only when scripts/check.ps1 runs (uv run --group lint): not part of the worker.
lint = ["ruff>=0.17.5", "vulture>=2.16"]
# Python control plane (Java-to-Python migration, docs/plans/java-to-python-migration.md): kept apart from the heavy worker deps.
studio = ["fastapi>=0.115", "uvicorn>=0.32", "psycopg[binary]>=3.2", "pyyaml>=6", "httpx>=0.27", "anthropic>=0.40"]

[tool.ruff]
line-length = 130
target-version = "py311"
# Legacy one-off scripts stay out of the lint gate; the maintained tools (podkit, film4k, gpu_lease, model_ab) are linted.
extend-exclude = ["tools/bakeoff", "tools/blender", "tools/chatterbox", "tools/live_status", "tools/ops", "infra", "reports", "research_notes"]

[tool.ruff.lint]
# Errors, unused imports/variables, import order, bugbear (likely bugs), simplifications.
select = ["E", "F", "W", "I", "B", "SIM"]
ignore = [
    "E501",   # long f-strings for ffmpeg filter graphs are clearer on one line
    # Style baseline (24 Nov 2026): present in old code, harmless, fixed when a file is touched anyway.
    "B905", "SIM105", "SIM108", "E741", "E402",
]

[tool.vulture]
paths = ["workers"]
exclude = ["workers/tests", "workers/modal_apps"]  # Modal apps are entered by Modal, not by our code
min_confidence = 80

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
# tools/blender scripts need Blender's own Python (bpy): never collect them.
testpaths = ["studio", "workers/tests", "tools/podkit", "tools/film4k", "tools/gpu_lease", "tools/vetting", "tools/qualitygate", "tools/golden"]
