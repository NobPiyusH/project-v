# Provider registry (HANDOVER §11.2, §12). Loaded at startup into the `provider` table.
# M1: config only; routing arrives in M3. Prices and quotas are starting points: verify before use (CLAUDE.md rule 7).
# Never put keys here. `secret_ref` names the .env variable that holds the key.
providers:
  - id: gemini_api
    name: Gemini API (text)
    kind: api
    capabilities: [llm.plan, llm.script, vlm.critic]
    secret_ref: GEMINI_API_KEY
    enabled: true

  # M3a router (18 Nov 2026): providers the router chooses between. quality = tier from our A/B tests (higher wins
  # when nothing else decides); budget = which monthly cap the job counts against (gemini | gpu | claude | none).
  - id: modal_wan
    name: Wan 2.2 image-to-video (Modal H100)
    kind: gpu_serverless
    capabilities: [video.i2v.draft, video.i2v.final, video.i2v.dream]   # dream: Dream Shorts clips (fast mode)
    quality: 6
    budget: gpu
    enabled: true

  # M3 GPU broker (docs/plans/m3-gpu-router.md): Dream Short pictures + clips on a rented pod (RunPod, Jarvislabs, ...).
  # The broker picks the cheapest provider and enforces pricing.gpuBroker caps itself, so no router budget bucket here.
  # Only used when projectv.dream.gpu-provider=broker.
  - id: gpu_pod
    name: Rented GPU pod (Wan 2.2 fp8 + FLUX.2 klein 4B / Z-Image Turbo, via the GPU broker)
    kind: gpu_pod
    capabilities: [image.dream, video.i2v.dream]
    quality: 6                     # fp8 Wan accepted by the owner as equal to Modal (20 Nov 2026)
    budget: none
    enabled: true

  - id: gemini_image
    name: Gemini image (Nano Banana, keyframes)
    kind: api
    capabilities: [image.keyframe.hero, image.keyframe.standard]
    quality: 8                     # better composition and reference-photo support than Z-Image
    budget: gemini
    secret_ref: GEMINI_API_KEY
    enabled: true

  - id: modal_zimage
    name: Z-Image Turbo (Modal L40S, keyframes)
    kind: gpu_serverless
    capabilities: [image.keyframe.hero, image.keyframe.standard, image.dream]
    quality: 6
    budget: gpu
    enabled: true

  - id: gemini_lyria
    name: Gemini Lyria (music for Dream Shorts)
    kind: api
    capabilities: [music.dream]
    quality: 7                     # owner's choice for Dream Shorts music (18 Nov 2026, ~₹10 a Short)
    budget: gemini                 # cost entries are recorded as gemini_api, the provider the Gemini cap counts
    secret_ref: GEMINI_API_KEY
    enabled: true

  - id: gemini_omni
    name: Gemini Omni 1.2 Flash (image-to-video)
    kind: api
    capabilities: [video.i2v.draft, video.i2v.final]
    quality: 8                     # better motion than a Wan final on the deep-ocean A/B (18 Nov 2026)
    budget: gemini
    secret_ref: GEMINI_API_KEY
    enabled: true

  # unused: no router job asks for these capabilities and Modal runs as modal_wan/modal_zimage; enable by adding a router job + candidate for video.wan22_14b
  # - id: modal_a100
  #   name: Modal (serverless A100)
  #   kind: gpu_serverless
  #   capabilities: [video.wan22_14b, image.flux2, upscale.seedvr, interp.rife]
  #   quota: { type: monthly_usd, amount: 30, reset: "monthly@1" }
  #   enabled: false

  # unused: no notebook adapter exists; enable by writing a Kaggle runner and a router/broker job that targets it
  # - id: kaggle_t4
  #   name: Kaggle notebooks (T4/P100)
  #   kind: gpu_notebook
  #   capabilities: [upscale.realesrgan, image.zimage_turbo, tts.kokoro, interp.rife]
  #   quota: { type: weekly_hours, amount: 30, reset: "weekly@SUN00:00Z" }
  #   enabled: false

  # unused: no notebook adapter exists; enable by writing a Lightning runner and a router/broker job that targets it
  # - id: lightning_t4
  #   name: Lightning AI (T4)
  #   kind: gpu_notebook
  #   capabilities: [upscale.realesrgan, image.zimage_turbo, interp.rife]
  #   quota: { type: monthly_credits, amount: 15, reset: "monthly@1" }
  #   enabled: false

  # unused: the GPU broker owns rented pods (pricing.gpuBroker.providers.vast, VastProvider in gpu/broker, cap in pricing.gpuBroker)
  # - id: vast_4090_interruptible
  #   name: Vast.ai RTX 4090 (interruptible)
  #   kind: gpu_pod
  #   capabilities: [video.wan22_14b, image.flux2, upscale.seedvr]
  #   cost: { unit: gpu_hour, live_price: true }
  #   interruptible: true
  #   enabled: false

  # unused: RunPod is the broker's runpod provider and the gpu_pod entry above; enable only if a router job needs a RunPod-specific capability
  # - id: runpod_4090_community
  #   name: RunPod RTX 4090 (community)
  #   kind: gpu_pod
  #   capabilities: [video.wan22_14b, image.flux2, upscale.seedvr]
  #   cost: { unit: gpu_hour, live_price: true }
  #   enabled: false

  # unused: no Veo client or router job (Veo is done by hand via manual_flow); enable by adding a Veo client and a video.veo_* job
  # - id: gemini_api_veo
  #   name: Gemini API Veo (video, paid)
  #   kind: api
  #   capabilities: [video.veo_fast, video.veo_quality]
  #   secret_ref: GEMINI_API_KEY
  #   enabled: false

  - id: manual_flow
    name: Google Flow (you, by hand)
    kind: manual
    capabilities: [video.veo_quality, video.omni_flash, image.nano_banana]
    quota: { type: monthly_credits, amount: 1000, daily_bonus: 50 }
    latency: human
    enabled: true

  - id: local_laptop
    name: This laptop (RTX 3050 4 GB)
    kind: local
    capabilities: [tts.kokoro, asr.whisper, ffmpeg, otio]
    enabled: true

# ---------------------------------------------------------------------------------------------------------------
# Pricing and budgets (M2a). Prices from Google's Gemini API pricing page, 16 Nov 2026: VERIFY before relying on them
# (CLAUDE.md rule 7). Used to estimate every CostEntry and to enforce the hard monthly cap.
pricing:
  fxInrPerUsd: 94               # re-verified 19 Nov 2026: closes 93.9-94.2 (12-16 Nov, PTI/HDFC Sky); recheck monthly
  # Router scoring (M3a, owner 18 Nov 2026): a provider must reach minQuality for the job; among those,
  # score = min(quality, enoughQuality) - lambda x cost, where lambda = lambdaPerInr / (share of that budget left,
  # floor 0.1): quality first, the cheaper tool when extra quality isn't needed, thriftier as a cap runs low.
  # AI Producer mode (docs/plans/ai-producer.md, owner 18 Nov 2026). P1 = advise-only: it recommends, the owner decides.
  producer:
    budgetPerShortInr: 100       # owner set: what the Producer may approve per Short (never above the monthly caps)
    budgetPerLongInr: 500        # per long-form video (default; owner can change)
    askAboveInr: 50              # any single decision above this goes to the owner
    redosPerItem: 2
    roundsPerStage: 3
    adviseOnly: true             # P1: recommend only; switch to deciding once agreement is high (P2)
    trustAfterDecisions: 10      # P2 'auto' trust: decide alone once it has agreed with the owner on enough decisions
    trustAgreementPct: 80
  routing:
    lambdaPerInr: 0.02            # quality points one rupee is worth with a full budget
    jobs:
      video.i2v.draft: { minQuality: 4, enoughQuality: 4 }   # drafts only judge motion
      video.i2v.final: { minQuality: 7, enoughQuality: 10 }
      image.keyframe.hero: { minQuality: 7, enoughQuality: 10 }      # opening, reveals, climax, ending
      image.keyframe.standard: { minQuality: 5, enoughQuality: 6 }   # the rest: good enough is enough
      image.dream: { minQuality: 5, enoughQuality: 6 }          # Dream Shorts pictures (owner target: under ₹20 a Short)
      video.i2v.dream: { minQuality: 5, enoughQuality: 6 }      # Dream Shorts clips: soft dreamcore look forgives fast mode
      music.dream: { minQuality: 5, enoughQuality: 7 }          # Dream Shorts score (Lyria)
  gemini:
    monthlyCapInr: 1000         # owner's cap; the app stops paid Gemini calls at this amount (Google budgets only alert)
    reserveInr: 20              # keep this much back for voice/music when deciding hero images
    calibration: 1.5            # Google's real bill ran ×1.53 the ledger's estimates (Nov 1-17 2026); recheck monthly
    text:  { inputPerMTokUsd: 0.75, outputPerMTokUsd: 3.75 }        # gemini-3.6/3.8-flash (pricing page re-verified 19 Nov 2026)
    tts:   { inputPerMTokUsd: 0.50, outputPerMTokUsd: 9.00 }        # gemini-3.8-flash-tts, audio out (re-verified 19 Nov 2026)
    # Announced on the Gemini API pricing page (re-verified 19 Nov 2026): from this date these replace the prices above,
    # so caps and estimates stay right after the date. Dates are UTC days, quoted.
    priceChanges:
      - from: "2027-01-01"
        text: { inputPerMTokUsd: 1.50, outputPerMTokUsd: 7.50 }
        tts:  { inputPerMTokUsd: 1.00, outputPerMTokUsd: 18.00 }
    image: { perImageUsd: { "1K": 0.0336, "2K": 0.0504, "4K": 0.113 } }  # gemini-nano-banana-2.1 (verify)
    music: { perSongUsd: 0.08 }                                     # lyria-3.5 per generated song (verify)
    groundingPerQueryUsd: 0.014                                     # Google Search grounding (verify)
    omni:                                                           # Gemini Omni Flash video (18 Nov 2026; verify)
      outputPerMTokUsd: 12.00     # gemini-omni-1.2-flash video output (pricing page 18 Nov 2026; 1.1 routes to 1.2 on 3 Dec)
      tokensPerSecond: { "360p": 1931, "720p": 5792, "1080p": 8688, "4k": 17376 }   # 720p measured: 28,960 tokens / 5 s
  aicredits:                     # errors-only text fallback (AICredits.in, INR wallet; 19 Nov 2026). Price = USD list x FX x 1.05 x 1.05 (gateway fee + GST)
    totalCapInr: 150             # owner raised 19 Nov 2026 (wallet ₹150); hard stop for ALL fallback spend (the prepaid wallet), enforced from the cost ledger
    markup: 1.1025
    # primary model id -> the same model on AICredits (ids checked against GET api.aicredits.in/api/models, 19 Nov 2026) and its USD list price
    models:
      gemini-3.6-flash:      { id: google/gemini-3.6-flash,      inputPerMTokUsd: 1.50, outputPerMTokUsd: 7.50 }
      gemini-3.5-flash:      { id: google/gemini-3.5-flash,      inputPerMTokUsd: 1.50, outputPerMTokUsd: 9.00 }
      gemini-3.5-flash-lite: { id: google/gemini-3.5-flash-lite, inputPerMTokUsd: 0.30, outputPerMTokUsd: 2.50 }
      claude-sonnet-5-5:     { id: anthropic/claude-sonnet-5.5,  inputPerMTokUsd: 2.00, outputPerMTokUsd: 10.00 }
  anthropic:
    monthlyCapUsd: 8             # owner-funded (17 Nov 2026: $5 credit; $8 cap once research + concept moved to Claude): hard stop, then Gemini
    sonnet: { inputPerMTokUsd: 2.00, outputPerMTokUsd: 10.00 }   # claude-sonnet-5-5 (verify on claude.com/pricing)
    webSearchPer1000Usd: 10.00   # server-side web search, backup researcher (verify on claude.com/pricing)
  elevenlabs:
    plan: free                   # owner's account (17 Nov 2026): 10,000 credits a month, non-commercial, attribution
    monthlyCredits: 10000
    usdPer1000Credits: 0.00      # set to the paid plan's rate when upgrading (verify on elevenlabs.io/pricing)
  # M3 GPU broker (docs/plans/m3-gpu-router.md): rented GPUs for Dream Shorts. Caps only, never prices (rule 7: hourly
  # rates are read live from each provider). 0 = blocked: the owner raises one when he says yes. Modal keeps its own cap below.
  gpuBroker:
    order: [runpod, jarvislabs, cloudrift, vast, e2e, shadeform, modal]   # tie-break only: the cheapest live price in stock and inside its cap wins
    totalCapUsd: 20              # all rented GPUs together per month (owner, 22 Nov 2026: 20, was 8)
    dailyCapUsd: 10.00           # all studio GPU spend per UTC day, booked rentals + the running pod (owner: 3.50 on 21 Nov 2026, 5.00 that evening, 10.00 on 22 Nov while testing); 0 = off
    providers:
      runpod:     { monthlyCapUsd: 12 }  # owner: 12 (22 Nov 2026, with the total at 20; was 8); other providers stay 0 until they have an adapter and a key
      # JarvisLabs (adapter built 22 Nov 2026 on the Python SDK; unproven until its canary passes, see docs/jarvislabs-provider-notes.md). Cap 0 = blocked: raise it
      # only when the owner approves the canary. GPU type names follow the CLI docs and are not verified live.
      jarvislabs:
        monthlyCapUsd: 0
        template: pytorch
        inrPerUsd: 94                 # the account bills in INR (live check 22 Nov 2026: A100 = Rs 84.24/h); recheck with fxInrPerUsd
        minBalance: 100               # preflight fails below this balance (account currency, INR)
        servicePort: 6006             # the port JarvisLabs publishes through the instance endpoint (docs)
        startTimeoutSeconds: 900
        gpus:
          - { type: "A100", vramGb: 40 }
          - { type: "A100-80GB", vramGb: 80 }
          - { type: "RTX-PRO6000", vramGb: 96 }
      cloudrift:  { monthlyCapUsd: 0 }
      # Vast.ai (owner, 21 Nov 2026: use it; strangers' machines, so tight filters and no secrets on the box). Every number is a limit or
      # an estimate, never a price: the hourly price is the live offer's. See VastConfig for what each one means.
      vast:
        monthlyCapUsd: 12                # owner 22 Nov 2026, with the total at 20 (was 5)
        gpuNames: ["RTX 4090", "RTX 5090", "L40S", "RTX A6000"]   # Vast gpu_name values, all >= 24 GB
        minReliability: 0.97
        minDownMbps: 500
        diskGb: 90                    # container disk rented, and the free disk an offer must have
        maxBandwidthUsd: 0.60         # skip hosts whose internet price makes download + upload cost more than this (some charge $50+/TB)
        downloadGb: 50                # expected download per rental (weights, ComfyUI, pip)
        uploadGb: 3                   # expected upload per rental (results back to the studio)
        amortizeHours: 0.75           # the internet bill is spread over this many hours into the effective hourly price
        startTimeoutSeconds: 480      # not running with its port mapped by then: destroyed, the next offer is tried (under the watchdog's 10 min lease grace)
        pollSeconds: 5
        offerAttempts: 2
        priceSlack: 1.25              # a replacement offer may cost at most this times the quoted price
      # E2E Networks (Delhi VMs, INR plans; docs/e2e-provider-notes.md). Limits and estimates only: the hourly price is the live plan price + GST.
      e2e:
        monthlyCapUsd: 5
        location: Delhi
        image: Ubuntu-22.04-GPU       # 22.04 ships Docker + NVIDIA toolkit
        inrPerUsd: 94
        gstPercent: 18
        publicPort: 443               # the default security group opens 80 and 443
        startTimeoutSeconds: 540
        plans:
          - { sku: "GDC3.L40S-60.220GB_v1", gpu: "L40S", vramGb: 48 }
          # the 22.04 template of the A40 SKU is named "2xA40-32.200GB_Ubuntu22": use the clean single-A40 template (20.04). A100 has no clean
          # template with Docker (22.04/20.04 are named 2x/4x, 24.04 has no Docker), so it is not offered.
          - { sku: "GDC3.A40-16.100GB", gpu: "A40", vramGb: 48, image: "Ubuntu-20.04-GPU" }
      shadeform:  { monthlyCapUsd: 0 }
    gpuPreference: ["NVIDIA GeForce RTX 4090", "NVIDIA GeForce RTX 5090", "NVIDIA RTX A6000", "NVIDIA L40S"]   # >= 24 GB, fp8 Wan
    minVramGb: 24
    minRamGb: 48                 # both idle fp8 experts + the fp16 text encoder stay in host RAM
    diskGb: 80                   # 41.6 GB weights + ComfyUI + clips
    expectedHours: 0.75          # boot + a Short's pictures and clips, used to check the wallet before renting
    port: 8000                   # the pod worker's HTTP port
  modal:
    monthlyFreeUsd: 30
    gpuPerSecondUsd: { L40S: 0.000542, H100: 0.001097, L4: 0.000222 }             # ~$1.95/h, ~$3.95/h (verify on modal.com/pricing)
    monthlyCapUsd: 0             # OWNER 20 Nov 2026: NO Modal use until 1 Dec 2026 (free credit renews). Set back to 30 on 1 Dec. Hard stop for GPU work; raise to allow paid GPU
    zimageSecondsPerImage: 6     # L40S render time per keyframe, router estimate only (verify on the ledger)
    containerStartSeconds: 140   # Wan container start + model load, billed once per container (measured 16 Nov)
    wanSecondsPer81Frames: { draft: 30, draft720: 133, final: 480 }   # H100 render time per 5 s clip: fast@480p (measured 17 Nov: ~12 s for 33 frames), fast@720p (measured 19 Nov: ~95 s for 57 frames), hybrid@720p (measured 483)
    wanFirstClipExtraSeconds: 64   # the first clip in a container is slower (warm-up), measured 19 Nov at 720p
    # Warm redos (optimisation review item 3, 19 Nov 2026): on a Short the AI Producer runs by itself, the Wan GPU stays
    # warm this long after each clip batch so a redo skips the ~105 s start-up + 64 s warm-up (≈₹17). The Producer's
    # review and redo land ~30-60 s after a batch. Costs ≤60 s more idle H100 (≈₹6) after the last batch. 0 = off.
    wanRedoHoldSeconds: 90
