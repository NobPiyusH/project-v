# Quality gate: lint + the tests that need no GPU, keys or Docker. Runs on pull requests and by hand (never on a plain push).
# The worker tests (workers/tests) need torch, Kokoro and manim and run on the laptop: `uv run --group dev python -m pytest`.
name: ci
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Lint (ruff)
        run: uvx ruff@0.17.5 check .
      - name: Tool tests (podkit, film4k, gpu_lease: pure Python, no network)
        run: uvx --with pytest pytest tools/podkit tools/film4k tools/gpu_lease -q -p no:cacheprovider
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Control-plane tests
        run: ./gradlew :control-plane:test --console=plain
