# Quality gate: lint + the tests that need no GPU, keys or Docker. Runs on pull requests and by hand (never on a plain push).
# The worker tests (workers/tests) need torch, Kokoro and manim and run on the laptop: `uv run --group dev python -m pytest`.
name: ci
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Lint (ruff)
        run: uvx ruff@0.17.5 check .
      - name: Tool tests (podkit, film4k, gpu_lease: pure Python, no network)
        run: uvx --with pytest pytest tools/podkit tools/film4k tools/gpu_lease -q -p no:cacheprovider
  studio:
    # The Python control plane (studio/): its tests run on a throwaway Postgres with the real schema (db/migration), a Temporal test server and
    # fakes for every paid or GPU service. No keys, no pods, nothing spent.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17-trixie
        env:
          POSTGRES_DB: projectv
          POSTGRES_USER: projectv
          POSTGRES_PASSWORD: projectv-local
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U projectv" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Control-plane tests
        run: uv run --group studio pytest studio -q -p no:cacheprovider
