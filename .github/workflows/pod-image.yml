# Builds the warm-start pod image on GitHub's runner (not the laptop). Manual only: nothing runs on push.
# Publishes to GHCR under the repo owner. Make the package public once (Package settings) so rented pods can pull it.
name: pod-image
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space (the runner's 14 GB SSD is tight for a ~12 GB base image)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag from the worker's pinned ComfyUI
        id: tag
        run: echo "tag=comfy-$(grep -oP '^COMFY_TAG = "\K[^"]+' workers/pod/server.py)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/pod/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/projectv-pod:${{ steps.tag.outputs.tag }}
