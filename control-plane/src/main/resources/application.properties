spring.application.name=projectv-control-plane
# Local secrets and settings come from .env in the repo root (git-ignored).
spring.config.import=optional:file:.env[.properties]

server.port=8080

spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5433/projectv}
spring.datasource.username=${POSTGRES_USER:projectv}
spring.datasource.password=${POSTGRES_PASSWORD:projectv-local}

# Gemini (Planner). If GEMINI_API_KEY is empty, the Planner falls back to its rule-based plan.
spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.chat.options.model=${GEMINI_MODEL:gemini-3.6-flash}
spring.ai.google.genai.chat.options.temperature=0.4

projectv.temporal.target=${TEMPORAL_TARGET:localhost:7233}
projectv.temporal.namespace=${TEMPORAL_NAMESPACE:default}
projectv.config-dir=config

management.endpoints.web.exposure.include=health,info

# M2a media models (Gemini API) and Modal app. Override in .env if Google renames or retires a model.
projectv.models.text=${GEMINI_MODEL:gemini-3.6-flash}
projectv.models.tts=${GEMINI_TTS_MODEL:gemini-3.8-flash-tts}
projectv.models.image=${GEMINI_IMAGE_MODEL:gemini-nano-banana-2.1}
projectv.models.music=${GEMINI_MUSIC_MODEL:lyria-3.5}
projectv.models.tts-voice=${GEMINI_TTS_VOICE:Charon}
projectv.modal.zimage-app=projectv-zimage
projectv.modal.zimage-class=ZImage
projectv.agents.timeout-seconds=150

projectv.s3.endpoint=${S3_ENDPOINT:http://localhost:8333}
projectv.s3.access-key=${S3_ACCESS_KEY:projectv}
projectv.s3.secret-key=${S3_SECRET_KEY:projectv-local-secret}
