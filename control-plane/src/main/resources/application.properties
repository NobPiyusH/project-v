spring.application.name=projectv-control-plane
# Local secrets and settings come from .env in the repo root (git-ignored).
spring.config.import=optional:file:.env[.properties]

server.port=8080
# Localhost only: the API has no login, so nothing else on the Wi-Fi may reach it.
server.address=127.0.0.1

spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5433/projectv}
spring.datasource.username=${POSTGRES_USER:projectv}
spring.datasource.password=${POSTGRES_PASSWORD:projectv-local}

# Gemini (Planner). If GEMINI_API_KEY is empty, the Planner falls back to its rule-based plan.
spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.chat.options.model=${GEMINI_MODEL:gemini-3.6-flash}
spring.ai.google.genai.chat.options.temperature=0.4
# Fail fast on an overloaded model and let the fallback list move on (owner, 18 Nov 2026); default was 10 tries.
spring.ai.retry.max-attempts=2
spring.ai.retry.backoff.initial-interval=2s
spring.ai.retry.backoff.max-interval=8s

projectv.temporal.target=${TEMPORAL_TARGET:localhost:7233}
projectv.temporal.namespace=${TEMPORAL_NAMESPACE:default}
projectv.config-dir=config

management.endpoints.web.exposure.include=health,info

# M2a media models (Gemini API) and Modal app. Override in .env if Google renames or retires a model.
# Work X: ordered fallback lists (comma-separated). If a model is retired, unknown, overloaded or hangs, the next one
# is used; billing/quota/content errors never hop models. Verify ids periodically (Google retires models without notice).
projectv.models.text=${GEMINI_MODEL:gemini-3.6-flash}
projectv.models.text-fallbacks=${GEMINI_TEXT_FALLBACKS:gemini-3.5-flash,nvidia:nvidia/nemotron-3-ultra-550b-a55b,nvidia:stepfun-ai/step-5-preview,groq:openai/gpt-oss-120b,openrouter:baidu/ernie-5.5-flash-preview:free,gemini-3.5-flash-lite,openrouter:google/gemma-4-31b-it:free}
projectv.nvidia.api-key=${NVIDIA_API_KEY:}
projectv.groq.api-key=${GROQ_API_KEY:}
projectv.openrouter.api-key=${OPENROUTER_API_KEY:}
# Claude (owner-funded, $5/month cap in config/providers.yaml): only the script and the shot plan; Gemini behind it.
projectv.anthropic.api-key=${ANTHROPIC_API_KEY:}
projectv.models.story=${CLAUDE_STORY_MODEL:claude:claude-sonnet-5-5}
# Script writer (owner A/B 23 Nov 2026: OpenAI scripts preferred). SCRIPT_MODEL=claude:claude-sonnet-5-5 in .env switches back.
projectv.models.script=${SCRIPT_MODEL:openai:gpt-5.4-mini}
projectv.openai.api-key=${OPENAI_API_KEY:}
# OpenAI list prices, USD per 1M tokens (re-verified 23 Nov 2026 by the quality-gate session; re-check before changing)
projectv.openai.price-in-usd-per-1m=${OPENAI_PRICE_IN:0.75}
projectv.openai.price-out-usd-per-1m=${OPENAI_PRICE_OUT:4.50}
# Cost levers, OFF until the owner A/Bs them (quality first): per-purpose Claude effort, e.g. SHOT_PLAN:low
projectv.claude.effort-overrides=${CLAUDE_EFFORT_OVERRIDES:}
# AICredits errors-only text fallback: off unless enabled AND a key is set (see config/providers.yaml pricing.aicredits)
projectv.aicredits.api-key=${AICREDITS_API_KEY:}
projectv.aicredits.base-url=${AICREDITS_BASE_URL:https://api.aicredits.in/v1}
projectv.aicredits.fallback-enabled=${AICREDITS_FALLBACK_ENABLED:false}
projectv.models.tts=${GEMINI_TTS_MODEL:gemini-3.8-flash-tts,gemini-3.1-flash-tts-preview}
projectv.models.image=${GEMINI_IMAGE_MODEL:gemini-nano-banana-2.1,gemini-3.1-flash-image}
projectv.models.music=${GEMINI_MUSIC_MODEL:lyria-3.5,lyria-3-pro-preview}
# Creative Director image review: a Gemini model that can see images (fallback order).
projectv.models.vision=${GEMINI_VISION_MODEL:gemini-3.6-flash,gemini-3.5-flash,gemini-3.5-flash-lite}
projectv.models.tts-voice=${GEMINI_TTS_VOICE:Charon}
projectv.modal.zimage-app=projectv-zimage
projectv.modal.zimage-class=ZImage
projectv.agents.timeout-seconds=75

projectv.s3.endpoint=${S3_ENDPOINT:http://localhost:8333}
projectv.s3.access-key=${S3_ACCESS_KEY:projectv}
projectv.s3.secret-key=${S3_SECRET_KEY:projectv-local-secret}

# Video clips per kind: wan (Modal H100) or omni (Gemini Omni Flash 720p; Gemini cap applies). Hybrid default.
projectv.video.provider-draft=${VIDEO_PROVIDER_DRAFT:wan}
projectv.video.provider-final=${VIDEO_PROVIDER_FINAL:omni}
# Video lanes (docs/video-lanes.md), both OFF by default. broker = the rented GPU pod via the GPU broker (needs DREAM_GPU_PROVIDER=broker).
projectv.video.provider-keyframes=${VIDEO_PROVIDER_KEYFRAMES:default}
projectv.video.diagram-lane=${VIDEO_DIAGRAM_LANE:false}
# Stock footage lane (docs/stock-footage-lane.md), all OFF. Keys PEXELS_API_KEY / PIXABAY_API_KEY go in the worker environment.
projectv.video.stock-lane=${VIDEO_STOCK_LANE:false}
projectv.video.stock-pexels=${VIDEO_STOCK_PEXELS:false}
projectv.video.stock-pixabay=${VIDEO_STOCK_PIXABAY:false}
projectv.video.stock-commons=${VIDEO_STOCK_COMMONS:false}
projectv.video.stock-archive=${VIDEO_STOCK_ARCHIVE:false}
projectv.video.gpu-idle-minutes=${VIDEO_GPU_IDLE_MINUTES:5}
# 2K delivery (docs/video-lanes.md): output-height 1440 = 2560x1440 master; diagram size should match. Defaults unchanged (1080p).
projectv.video.output-height=${VIDEO_OUTPUT_HEIGHT:0}
projectv.video.diagram-width=${VIDEO_DIAGRAM_WIDTH:1920}
projectv.video.diagram-height=${VIDEO_DIAGRAM_HEIGHT:1080}
projectv.video.omni-model=${OMNI_MODEL:gemini-omni-1.2-flash}
# Dream Shorts (docs/plans/dream-shorts.md): GPU batches above this amount wait for the owner's OK (0 = always ask);
# shot length in seconds (Wan 16 fps, 2-5 s); a folder of music tracks the owner chose (empty = no music)
projectv.dream.auto-approve-inr=${DREAM_AUTO_APPROVE_INR:0}
# Picture model for Dream Shorts on the rented pod: flux2-klein (FLUX.2 klein 4B, owner's pick 21 Nov 2026) or zimage.
# Each Short can still pick Z-Image in the dashboard. The Modal route always uses Z-Image.
projectv.dream.picture-model=${DREAM_PICTURE_MODEL:flux2-klein}
projectv.dream.shot-seconds=${DREAM_SHOT_SECONDS:3.5}
projectv.dream.music-dir=${DREAM_MUSIC_DIR:}
# The owner's own track used as every Dream Short's music by default (storage address, e.g. s3://projectv/music-beds/x.m4a); Lyria is a per-Short option
projectv.dream.music-bed=${DREAM_MUSIC_BED:}
# Dream Shorts: Gemini watches every finished Short against the owner's checklist (about Rs 0.5); false switches it off
projectv.dream.quality-check=${DREAM_QUALITY_CHECK:true}

# GPU pod watchdog (CLAUDE.md rule 8; com.projectv.gpu). Only pods named with the prefix are ever touched. LIVE by default
# since 21 Nov 2026 (owner's OK): it terminates studio pods past their limits; GPU_WATCHDOG_DRY_RUN=true only logs. Limits, not prices:
# a pod's hourly rate is read live from RunPod. Every studio pod must also be created with PodSelfStop.wrap(...).
# Which GPU path Dream Shorts use for pictures and clips: modal (today, default) or broker (rented pods, docs/plans/m3-gpu-router.md).
projectv.dream.gpu-provider=${DREAM_GPU_PROVIDER:modal}
# Rented-pod worker (workers/pod/server.py, shipped to the pod through env vars), image, optional volume, time estimates (not prices).
# Path is relative to the control plane's working directory; bootRun runs in control-plane/, so the default points one level up.
projectv.gpu.pod-worker-file=${POD_WORKER_FILE:../workers/pod/server.py}
projectv.gpu.pod-image=${POD_IMAGE:runpod/pytorch:1.0.2-cu1281-torch280-ubuntu2404}
projectv.gpu.pod-volume-id=${POD_VOLUME_ID:}
# Warm-start image (docs/warm-start-plan.md, docker/pod/Dockerfile). Blank = OFF: the plain pod-image above plus the boot install.
# Set e.g. ghcr.io/<owner>/projectv-pod:<tag> only after the image is built and public; every provider then rents it.
projectv.gpu.warm-image=${POD_WARM_IMAGE:}
projectv.gpu.pod-ready-minutes=${POD_READY_MINUTES:30}
projectv.gpu.seconds-per-picture=${POD_SECONDS_PER_PICTURE:10}
projectv.gpu.seconds-per-81-frames=${POD_SECONDS_PER_81_FRAMES:76}
projectv.gpu.pod-start-seconds=${POD_START_SECONDS:900}
# Per-Short rental estimate (dream.RentalEstimate): start + pictures x these + clips x seconds-per-81-frames + SVI setup.
# Used by the daily GPU cap check before renting and by the dashboard. Unknown work falls back to pricing.gpuBroker.expectedHours.
projectv.gpu.seconds-per-picture-flux=${POD_SECONDS_PER_PICTURE_FLUX:3}
projectv.gpu.seconds-per-picture-zimage=${POD_SECONDS_PER_PICTURE_ZIMAGE:5}
projectv.gpu.svi-setup-seconds=${POD_SVI_SETUP_SECONDS:180}
projectv.runpod.api-key=${RUNPOD_API_KEY:}
projectv.runpod.base-url=${RUNPOD_BASE_URL:https://api.runpod.io/v2}
# Vast.ai (strangers' machines: no key and no secret ever goes to an instance). Cap and offer filter: config/providers.yaml, pricing.gpuBroker.providers.vast.
projectv.vast.api-key=${VAST_API_KEY:}
projectv.vast.base-url=${VAST_BASE_URL:https://console.vast.ai/api/v0}
# 2FA session key for instance/account calls (vastai tfa login). Empty: read ~/.config/vastai/vast_tfa_key on every call.
projectv.vast.session-key=${VAST_SESSION_KEY:}
# Base32 TOTP seed: the adapter then logs in to Vast 2FA itself (session key kept in memory only). Both factors then sit in .env.
projectv.vast.totp-secret=${VAST_TOTP_SECRET:}
# E2E Networks (Indian GPU cloud). Cap and plans: config/providers.yaml, pricing.gpuBroker.providers.e2e.
projectv.e2e.api-key=${E2E_API_KEY:}
projectv.e2e.auth-token=${E2E_AUTH_TOKEN:}
projectv.e2e.project-id=${E2E_PROJECT_ID:}
# JarvisLabs (no REST API is documented: the adapter runs workers/jarvislabs_helper.py with the jarvislabs SDK; the key goes only to that process). Cap and GPUs: config/providers.yaml.
projectv.jarvislabs.api-key=${JARVISLABS_API_KEY:}
projectv.jarvislabs.command=${JARVISLABS_COMMAND:uv run --with jarvislabs python}
# Per-rental bearer token for the pod worker's HTTP port (Vast.ai always). Secret: POD_TOKEN_SECRET, else derived from the provider keys. RunPod pods get it too unless switched off.
projectv.gpu.worker-token-secret=${POD_TOKEN_SECRET:}
projectv.gpu.worker-token-runpod=${POD_TOKEN_RUNPOD:true}
projectv.gpu.watchdog.dry-run=${GPU_WATCHDOG_DRY_RUN:false}
projectv.gpu.watchdog.poll-seconds=${GPU_WATCHDOG_POLL_SECONDS:180}
projectv.gpu.pod-prefix=${GPU_POD_PREFIX:projectv-}
projectv.gpu.max-runtime-minutes=${GPU_MAX_RUNTIME_MINUTES:180}
projectv.gpu.idle-minutes=${GPU_IDLE_MINUTES:15}
projectv.gpu.lease-grace-minutes=${GPU_LEASE_GRACE_MINUTES:10}
# ONE shared pod for all Shorts (owner, 20 Nov 2026); more than 1 is only a safety margin if a pod must be replaced.
projectv.gpu.max-pods=${GPU_MAX_PODS:1}
projectv.gpu.max-hourly-usd=${GPU_MAX_HOURLY_USD:2.0}
